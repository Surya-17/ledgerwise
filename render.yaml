# Render Blueprint: New > Blueprint > pick this repo. Creates the web service and database.
services:
  - type: web
    name: ledgerwise
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerwise-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '[]' # same-origin: the API serves the frontend
      - key: AI_API_KEY # optional: free Gemini key for "describe the bill"; set it in the dashboard
        sync: false

databases:
  - name: ledgerwise-db
    plan: free
    databaseName: ledgerwise
    postgresMajorVersion: "17"
