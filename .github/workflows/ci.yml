name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledgerwise_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ledgerwise_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ledgerwise_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations apply and match the models
        run: |
          alembic upgrade head
          alembic check
      - name: Tests (PostgreSQL, including trigger tests)
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build # tsc type-check + Vite production build

  docker:
    # Build the production image and boot it against PostgreSQL, exactly as Render runs it.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledgerwise
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ledgerwise .
      - name: Boot (runs migrations on start)
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/ledgerwise \
            -e JWT_SECRET=ci-only-secret -e PORT=8000 ledgerwise
          for i in $(seq 1 60); do
            curl -fsS localhost:8000/api/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1
      - name: Smoke test
        run: |
          set -euo pipefail
          # Fetch into variables first: `curl | grep -q` under pipefail fails when grep
          # exits early and curl gets SIGPIPE.
          home=$(curl -fsS localhost:8000/)
          grep -q "<title>Ledgerwise</title>" <<<"$home"
          deep=$(curl -fsS localhost:8000/transactions)   # SPA deep link
          grep -q 'id="root"' <<<"$deep"
          headers=$(curl -fsS -D - -o /dev/null localhost:8000/api/health)
          grep -qi "x-content-type-options: nosniff" <<<"$headers"
          grep -qi "content-security-policy:" <<<"$headers"
          TOKEN=$(curl -fsS -X POST localhost:8000/api/auth/demo | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          curl -fsS -H "Authorization: Bearer $TOKEN" localhost:8000/api/accounts | python3 -c "import sys,json;a=json.load(sys.stdin);assert any(x['name']=='Checking' for x in a),a"
          curl -fsS -H "Authorization: Bearer $TOKEN" localhost:8000/api/reports/recurring | python3 -c "import sys,json;assert len(json.load(sys.stdin))>3"
          echo "Smoke test passed"
      - name: Logs on failure
        if: failure()
        run: docker logs app || true
